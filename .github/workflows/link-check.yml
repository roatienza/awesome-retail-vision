name: Link Check

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Mondays 06:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["README.md", "CONTRIBUTING.md"]

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --timeout 20
            --max-retries 2
            README.md CONTRIBUTING.md
          fail: false
          output: /tmp/lychee-report.md
      - name: Report
        run: |
          if grep -q "Errors" /tmp/lychee-report.md; then
            echo "::warning::Broken links found — see report below"
            cat /tmp/lychee-report.md
          else
            echo "All links OK"
          fi